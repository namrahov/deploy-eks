# Secrets Manager -> k8s Secret synchronization
#
# WARNING: the remoteRef.key values below must match var.project
# ("<project>/db-credentials"). To get the exact name:
#   terraform output -raw db_secret_name
# If they don't match: kubectl get externalsecret -n app -> SecretSyncedError,
# the db-credentials Secret is never created, and the backend pods get stuck
# in CreateContainerConfigError.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: app
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1        # <-- your own region
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: app
spec:
  refreshInterval: 1h             # auto-refreshes if the password is rotated
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: db-credentials          # name of the k8s Secret that will be created
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: my-springboot-eks/db-credentials   # <-- terraform output db_secret_name
        property: username
    - secretKey: password
      remoteRef:
        key: my-springboot-eks/db-credentials
        property: password
    - secretKey: jdbc_url
      remoteRef:
        key: my-springboot-eks/db-credentials
        property: jdbc_url
