apiVersion: v1
kind: Namespace
metadata:
  name: app
---
# WARNING: if you change this name you must change it in 3 places at once,
# otherwise the pod won't start:
#   - external-secrets.tf -> aws_eks_pod_identity_association.backend.service_account
#   - test-backend/02-backend.yaml -> spec.template.spec.serviceAccountName
#   - this file
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: app
