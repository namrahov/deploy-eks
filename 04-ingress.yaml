# =========================================================================
# EKS AUTO MODE ucun. Auto Mode-da ALB controller quraşdırılmış gəlir.
# Klassik EKS istifade edirsense:
#   - AWS Load Balancer Controller-i Helm ile qur
#   - controller: ingress.k8s.aws/alb  (asagidaki eks.amazonaws.com/alb evezine)
#   - IngressClassParams-a ehtiyac yoxdur, annotation-lar kifayetdir
# =========================================================================
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: alb
spec:
  scheme: internet-facing
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: alb
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # "ip" = trafik birbasa pod-a gedir (NodePort hop-u yoxdur)
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/success-codes: "200"
    # Butun Ingress-ler eyni ALB-ni paylassin (pula qenaet)
    alb.ingress.kubernetes.io/group.name: app

    # QEYD: healthcheck-path BURADA teyin olunmur, cunki backend ve frontend
    # ucun ferqlidir. Hemin annotation her Service-in ustundedir
    # (test-backend/02-backend.yaml, test-frontend/03-frontend.yaml).
    # Burada teyin etsen HER IKI target group ucun eyni yol islenir ve
    # birinin health check-i mutleq dusur.

    # ---- HTTPS (ACM sertifikat oldugda serhi ac) ----
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...
    # alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # SIRA VACIBDIR: spesifik yol umumi yoldan evvel gelmelidir
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          # /actuator BILEREKDEN internete acilmir: exposure siyahisinda
          # metrics ve prometheus var - onlar endpoint adlarini, JVM/DB
          # metrikalarini ve trafik hecmini kenar adama verir.
          # ALB health check-i target group seviyyesindedir, Ingress
          # qaydasindan asili deyil - ona gore bu yolu silmek probe-lari sindirmir.
          # Prometheus scrape cluster daxilinden Service uzerinden edilir.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
