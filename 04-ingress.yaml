# =========================================================================
# FOR EKS AUTO MODE. In Auto Mode the ALB controller comes pre-installed.
# If you use classic EKS:
#   - install the AWS Load Balancer Controller with Helm
#   - controller: ingress.k8s.aws/alb  (instead of eks.amazonaws.com/alb below)
#   - IngressClassParams is not needed, the annotations are enough
# =========================================================================
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: alb
spec:
  scheme: internet-facing
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: alb
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # "ip" = traffic goes straight to the pod (no NodePort hop)
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/success-codes: "200"
    # Let all Ingresses share the same ALB (saves money)
    alb.ingress.kubernetes.io/group.name: app

    # NOTE: healthcheck-path is NOT set HERE, because it differs for the
    # backend and the frontend. That annotation sits on each Service
    # (test-backend/02-backend.yaml, test-frontend/03-frontend.yaml).
    # If you set it here, the same path is used for BOTH target groups and
    # one of them is guaranteed to fail its health check.

    # ---- HTTPS (uncomment once you have an ACM certificate) ----
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...
    # alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # ORDER MATTERS: the specific path must come before the general one
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          # /actuator is DELIBERATELY not exposed to the internet: the exposure
          # list contains metrics and prometheus - those hand an outsider the
          # endpoint names, JVM/DB metrics and traffic volume.
          # The ALB health check is at the target group level, independent of the
          # Ingress rules - so removing this path does not break the probes.
          # Prometheus scraping is done from inside the cluster via the Service.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
