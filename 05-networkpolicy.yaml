# Zero-trust: default olaraq hər şeyi bağla, sonra lazım olanı aç.
# QEYD: NetworkPolicy isləməsi üçün CNI-nin dəstəyi lazımdır.
# EKS Auto Mode və yeni VPC CNI (v1.14+ enableNetworkPolicy) dəstəkləyir.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: app
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-and-frontend
  namespace: app
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: [Ingress]
  ingress:
    # ALB target-type=ip ilə birbaşa pod-a gəlir (VPC daxilindən)
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 8080
