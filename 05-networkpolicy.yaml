# Zero-trust: default olaraq hər şeyi bağla, sonra lazım olanı aç.
# QEYD: NetworkPolicy isləməsi üçün CNI-nin dəstəyi lazımdır.
# EKS Auto Mode və yeni VPC CNI (v1.14+ enableNetworkPolicy) dəstəkləyir.
#
# DIQQET: asagidaki cidr var.vpc_cidr (default 10.0.0.0/16) ile eyni olmalidir.
# vpc_cidr-i deyisdirsen burani da deyis, yoxsa ALB pod-lara catmir.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: app
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-backend
  namespace: app
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: [Ingress]
  ingress:
    # ALB target-type=ip ilə birbaşa pod-a gəlir (VPC daxilindən)
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 8080
---
# BU OLMASA frontend tamamile baglidir: yuxaridaki default-deny namespace-deki
# BUTUN pod-lara aiddir, backend ucun istisna var idi, frontend ucun yox idi.
# Neticede ALB health check-i dusur ve "/" 503 qaytarir.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-frontend
  namespace: app
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 8080
