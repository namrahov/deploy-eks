# Zero-trust: deny everything by default, then open only what is needed.
# NOTE: NetworkPolicy requires CNI support to take effect.
# EKS Auto Mode and the newer VPC CNI (v1.14+ enableNetworkPolicy) support it.
#
# WARNING: the cidr below must match var.vpc_cidr (default 10.0.0.0/16).
# If you change vpc_cidr, change it here too, otherwise the ALB can't reach the pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: app
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-backend
  namespace: app
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: [Ingress]
  ingress:
    # With target-type=ip the ALB reaches the pod directly (from inside the VPC)
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 8080
---
# WITHOUT THIS the frontend is fully blocked: the default-deny above applies to
# ALL pods in the namespace; there was an exception for the backend but not for
# the frontend. The result: the ALB health check fails and "/" returns 503.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-frontend
  namespace: app
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 8080
